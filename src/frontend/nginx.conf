server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Serve static asset files directly; do NOT fallback to index.html if missing
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    # SPA routing fallback for page navigation
    location / {
        index index.html index.csr.html;
        try_files \(uri\)uri/ /index.html /index.csr.html =404;
    }
}